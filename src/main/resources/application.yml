server:
  port: 8080

spring:
  application:
    name: paper-bridge-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paper_teacher?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    issuer: paper-bridge
    secret: ${APP_JWT_SECRET:}
    expires-minutes: 720
  ai:
    provider: deepseek
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      temperature: 0.2
